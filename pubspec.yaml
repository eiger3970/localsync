name: localsync
description: Local-first Obsidian sync. No cloud. No subscription.
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  url_launcher: ^6.2.4
  git2dart: ^0.5.4
  path_provider: ^2.1.3
  cryptography: ^2.7.0
  openssh_ed25519: ^1.0.0
  dartssh2: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Dev-time-only code generator: reads assets/icon/icon.png and writes
  # the full iOS icon set into ios/Runner/Assets.xcassets/AppIcon.
  # appiconset/ ahead of time. Not a runtime dependency - doesn't add
  # any native code to the shipped app, just static image files, so
  # safe to add given how much native-dependency pain this session
  # already had elsewhere (2026-08-09).
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/gifs/

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  ios: true
  android: false
  remove_alpha_ios: true
