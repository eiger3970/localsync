name: localsync
description: Local-first Obsidian sync. No cloud. No subscription.
version: 0.1.0+7

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  url_launcher: ^6.2.4
  git2dart: ^0.5.4
  path_provider: ^2.1.3
  cryptography: ^2.7.0
  openssh_ed25519: ^1.0.0
  dartssh2: ^2.9.0
  flutter_svg: ^2.0.10+1
  # 2026-08-18: default device name (e.g. "Ken's iPhone") for the sync
  # identity/conflict "who" - pure-Dart plugin API, no CocoaPods native
  # code of its own to link (unlike git2dart's FFI symbols), so lower
  # risk than that saga, but still a new native platform channel.
  device_info_plus: ^10.1.0
  # 2026-08-28: real feedback, live - fixes that were genuinely pushed
  # and merged still read as "not applied" during a real device test,
  # traced back to pubspec.yaml's build number never having been
  # bumped (every build today shared the same CFBundleVersion, which
  # can make a sideload tool treat a new build as already installed).
  # No way from inside the app itself to confirm which build is
  # actually running - this makes that answerable at a glance instead
  # of inferred from git commits after the fact.
  package_info_plus: ^8.0.0
  # 2026-08-21: switched from raw in_app_purchase (hand-rolled StoreKit
  # calls) to RevenueCat's own SDK - handles receipt validation and
  # purchase-restore correctness that would otherwise need hand-
  # rolling, and lets pricing/paywall config change server-side later
  # without an app update. Still no Apple Developer account active
  # (funds not available to renew) and no RevenueCat API key yet
  # either - purchase_service.dart guards against an empty key so this
  # compiles and runs clean either way, just does nothing purchase-
  # related until a real key is set.
  purchases_flutter: ^8.4.4
  # 2026-08-21: RevenueCat's prebuilt paywall UI package - added for
  # availability, not currently used. ConflictPickerUpsell
  # (widgets/conflict_picker_upsell.dart) is the real upsell UI, built
  # to a specific non-generic spec (McDonald's-style, deliberately not
  # a lock-screen paywall) - swapping to this package's own paywall
  # screen would replace that design, a real UX call the user hasn't
  # made, not an automatic upgrade.
  purchases_ui_flutter: ^8.11.0
  # 2026-08-21: real auto-discovery, item 2 of the IAP build order -
  # pure-Dart mDNS (raw UDP multicast, not Apple's native
  # NetServiceBrowser), so no CocoaPods native linking risk beyond the
  # Info.plist entitlement itself (NSBonjourServices, added alongside
  # this). Genuinely unverified whether iOS enforces the same
  # NSBonjourServices requirement for raw-socket multicast as it does
  # for the native Bonjour API - added the entitlement anyway as the
  # documented-correct, safe precaution.
  multicast_dns: ^0.3.2+7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Dev-time-only code generator: reads assets/icon/icon.png and writes
  # the full iOS icon set into ios/Runner/Assets.xcassets/AppIcon.
  # appiconset/ ahead of time. Not a runtime dependency - doesn't add
  # any native code to the shipped app, just static image files, so
  # safe to add given how much native-dependency pain this session
  # already had elsewhere (2026-08-09).
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/gifs/
    - assets/icon/icon.png
    - assets/icon/logo_word_with_circle.png
    - assets/pairing/
    - assets/flags/

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  ios: true
  android: false
  remove_alpha_ios: true
