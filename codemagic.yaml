workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Clean stale build/Pods cache
        script: flutter clean
      - name: Disable Swift Package Manager, force CocoaPods
        script: flutter config --no-enable-swift-package-manager
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods (retry on CDN trunk rate-limit)
        # 2026-08-25: see matching step in .github/workflows/ios-build.yml
        # for the full explanation - no committed Podfile.lock means a
        # full dependency resolution every run, which trips CocoaPods
        # CDN trunk's raw.githubusercontent.com fallback rate limit.
        script: |
          cd ios
          for i in 1 2 3 4 5; do
            pod install && exit 0
            echo "pod install failed (attempt $i/5), waiting 45s before retry..."
            sleep 45
          done
          echo "pod install failed after 5 attempts"
          exit 1
      - name: Build iOS archive
        script: |
          flutter build ipa --release --no-codesign --verbose 2>&1 | tee /tmp/build_verbose.log
          mkdir -p build/ios/ipa
          cd build/ios/archive
          mkdir -p Payload
          cp -r Runner.xcarchive/Products/Applications/Runner.app Payload/
          zip -r ../ipa/Runner.ipa Payload/
      - name: Verify libgit2 is actually embedded (diagnostic, not a fix)
        script: |
          APP=build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app
          echo "=== Podfile.lock: was git2dart_binaries built via CocoaPods? ==="
          grep -A3 -i "git2dart" ios/Podfile.lock || echo "MISSING: git2dart not in Podfile.lock at all"
          echo "=== Frameworks/ inside Runner.app ==="
          ls -la "$APP/Frameworks/" 2>&1 || echo "MISSING: no Frameworks dir in Runner.app"
          echo "=== Does the Runner binary link libgit2/libssh2 at all? ==="
          otool -L "$APP/Runner" 2>&1 | grep -i "git\|ssh2\|crypto" || echo "MISSING: no git/ssh2/crypto linkage found via otool -L"
          echo "=== Is git_libgit2_init present in the Runner binary's own symbol table? ==="
          nm "$APP/Runner" 2>&1 | grep git_libgit2 || echo "MISSING: git_libgit2_init not found via nm on Runner binary"
          echo "=== Ground truth: Runner target's ACTUALLY RESOLVED OTHER_LDFLAGS ==="
          echo "(checks whether git2dart_binaries' own -force_load flag ever reached the Runner target itself, not just the pod's own target)"
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -showBuildSettings 2>&1 | grep -i "OTHER_LDFLAGS" || echo "MISSING: xcodebuild showBuildSettings found no OTHER_LDFLAGS for Runner"
          echo "=== The generated Pods-Runner xcconfig (aggregate of all pods' user_target_xcconfig) ==="
          find Pods/Target\ Support\ Files/Pods-Runner -iname "*.release.xcconfig" -exec sh -c 'echo "--- {} ---"; grep -i "OTHER_LDFLAGS\|force_load" "{}" || echo "no OTHER_LDFLAGS/force_load line in this file"' \; 2>&1 || echo "MISSING: no Pods-Runner Target Support Files dir"
          echo "=== git2dart_binaries' own generated xcconfig (should contain the -force_load line per its podspec) ==="
          find Pods/Target\ Support\ Files/git2dart_binaries -iname "*.xcconfig" -exec sh -c 'echo "--- {} ---"; grep -i "OTHER_LDFLAGS\|force_load" "{}" || echo "no OTHER_LDFLAGS/force_load line in this file"' \; 2>&1 || echo "MISSING: no git2dart_binaries Target Support Files dir"
          cd ..
          echo "=== The REAL linker invocation from the actual build (not a post-hoc re-query) ==="
          echo "(does -force_load genuinely appear in the command that really built Runner?)"
          grep -B2 -A2 "force_load" /tmp/build_verbose.log | head -100 || echo "MISSING: force_load never appeared anywhere in the real build log"
          echo "=== Any linker warnings/errors that could silently drop the forced symbols ==="
          grep -i "ld: warning\|ld: error\|duplicate symbol\|git2dart\|libgit2" /tmp/build_verbose.log | head -80 || echo "no matching lines found"
    artifacts:
      - build/ios/ipa/*.ipa

  # Real App Store submission workflow — scaffolded 2026-08-23, NOT usable yet.
  # Blocked entirely on a funded Apple Developer Program account ($99/yr):
  # without it there is no App Store Connect API key, no distribution
  # certificate, no provisioning profile, and this workflow cannot run.
  # Once the account exists, fill in the 4 TODOs below (Codemagic's own
  # "iOS code signing" docs walk through generating each one) and this
  # workflow builds, signs, and uploads straight to TestFlight/App Store
  # Connect in one step — no other change needed.
  ios-app-store:
    name: iOS App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        distribution_type: app_store
        # TODO: create in Codemagic > Team settings > Code signing identities,
        # after uploading your Apple Distribution certificate (.p12).
        bundle_identifier: com.kworld.localsync
      groups:
        # TODO: create this group in Codemagic > Team settings > Environment
        # variables, containing APP_STORE_CONNECT_ISSUER_ID,
        # APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_PRIVATE_KEY —
        # generated from App Store Connect > Users and Access > Integrations
        # > App Store Connect API, once the account is funded.
        - app_store_credentials
    scripts:
      - name: Disable Swift Package Manager, force CocoaPods
        script: flutter config --no-enable-swift-package-manager
      - name: Get Flutter packages
        script: flutter pub get
      - name: Set up code signing
        script: |
          # TODO: once app_store_credentials exists, this fetches the
          # matching provisioning profile/certificate automatically via
          # Codemagic's App Store Connect integration.
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build and sign IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false  # flip to true only when ready for real review
