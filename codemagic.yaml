workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Clean stale build/Pods cache
        script: flutter clean
      - name: Disable Swift Package Manager, force CocoaPods
        script: flutter config --no-enable-swift-package-manager
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build iOS archive
        script: |
          flutter build ipa --release --no-codesign --verbose 2>&1 | tee /tmp/build_verbose.log
          mkdir -p build/ios/ipa
          cd build/ios/archive
          mkdir -p Payload
          cp -r Runner.xcarchive/Products/Applications/Runner.app Payload/
          zip -r ../ipa/Runner.ipa Payload/
      - name: Verify libgit2 is actually embedded (diagnostic, not a fix)
        script: |
          APP=build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app
          echo "=== Podfile.lock: was git2dart_binaries built via CocoaPods? ==="
          grep -A3 -i "git2dart" ios/Podfile.lock || echo "MISSING: git2dart not in Podfile.lock at all"
          echo "=== Frameworks/ inside Runner.app ==="
          ls -la "$APP/Frameworks/" 2>&1 || echo "MISSING: no Frameworks dir in Runner.app"
          echo "=== Does the Runner binary link libgit2/libssh2 at all? ==="
          otool -L "$APP/Runner" 2>&1 | grep -i "git\|ssh2\|crypto" || echo "MISSING: no git/ssh2/crypto linkage found via otool -L"
          echo "=== Is git_libgit2_init present in the Runner binary's own symbol table? ==="
          nm "$APP/Runner" 2>&1 | grep git_libgit2 || echo "MISSING: git_libgit2_init not found via nm on Runner binary"
          echo "=== Ground truth: Runner target's ACTUALLY RESOLVED OTHER_LDFLAGS ==="
          echo "(checks whether git2dart_binaries' own -force_load flag ever reached the Runner target itself, not just the pod's own target)"
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -showBuildSettings 2>&1 | grep -i "OTHER_LDFLAGS" || echo "MISSING: xcodebuild showBuildSettings found no OTHER_LDFLAGS for Runner"
          echo "=== The generated Pods-Runner xcconfig (aggregate of all pods' user_target_xcconfig) ==="
          find Pods/Target\ Support\ Files/Pods-Runner -iname "*.release.xcconfig" -exec sh -c 'echo "--- {} ---"; grep -i "OTHER_LDFLAGS\|force_load" "{}" || echo "no OTHER_LDFLAGS/force_load line in this file"' \; 2>&1 || echo "MISSING: no Pods-Runner Target Support Files dir"
          echo "=== git2dart_binaries' own generated xcconfig (should contain the -force_load line per its podspec) ==="
          find Pods/Target\ Support\ Files/git2dart_binaries -iname "*.xcconfig" -exec sh -c 'echo "--- {} ---"; grep -i "OTHER_LDFLAGS\|force_load" "{}" || echo "no OTHER_LDFLAGS/force_load line in this file"' \; 2>&1 || echo "MISSING: no git2dart_binaries Target Support Files dir"
          cd ..
          echo "=== The REAL linker invocation from the actual build (not a post-hoc re-query) ==="
          echo "(does -force_load genuinely appear in the command that really built Runner?)"
          grep -B2 -A2 "force_load" /tmp/build_verbose.log | head -100 || echo "MISSING: force_load never appeared anywhere in the real build log"
          echo "=== Any linker warnings/errors that could silently drop the forced symbols ==="
          grep -i "ld: warning\|ld: error\|duplicate symbol\|git2dart\|libgit2" /tmp/build_verbose.log | head -80 || echo "no matching lines found"
    artifacts:
      - build/ios/ipa/*.ipa
