# 2026-09-24: signed App Store build -> TestFlight, without a Mac.
#
# Why this exists: every build so far was unsigned (ios-build.yml) and
# sideloaded with iLoader, which signs the app and its widget into
# SEPARATE App Group containers - the widget's "Never synced" can't be
# fixed from code (see project memory, 2026-09-17). Real App Store
# signing (Apple Distribution certificate + App Store profiles that
# carry group.com.kworld.localsync) is also what sandbox in-app
# purchases and the App Store itself need.
#
# How: the same unsigned archive ios-build.yml already produces, then
# re-signed here - widget first, then embedded frameworks, then the app
# - with the distribution identity and each target's own App Store
# profile, packaged as an .ipa and uploaded with an App Store Connect
# API key. The Xcode project's own signing settings stay untouched.
#
# Manual only (Actions tab -> "iOS TestFlight" -> Run workflow): every
# run uploads a new TestFlight build, so it never fires on a push.
#
# Secrets (repo Settings -> Secrets and variables -> Actions):
#   IOS_DIST_P12_BASE64 / IOS_DIST_P12_PASSWORD - Apple Distribution cert
#   IOS_PROFILE_APP_BASE64      - "LocalSync App Store" profile
#   IOS_PROFILE_WIDGET_BASE64   - "LocalSync Widget App Store" profile
#   ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8 - App Store Connect API key

name: iOS TestFlight

on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Clean stale build/Pods cache
        run: flutter clean

      - name: Disable Swift Package Manager, force CocoaPods
        run: flutter config --no-enable-swift-package-manager

      - name: Get Flutter packages
        run: flutter pub get

      # Build number must rise with every upload: pubspec's +103 plus this
      # workflow's own run counter keeps it unique and increasing.
      # STORE_BUILD=true switches RevenueCat to the real App Store key
      # (purchase_service.dart).
      - name: Build unsigned archive
        run: |
          set -o pipefail
          BUILD_NUMBER=$((200 + ${{ github.run_number }}))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          for i in 1 2 3 4 5; do
            flutter build ipa --release --no-codesign \
              --build-number="$BUILD_NUMBER" \
              --dart-define=STORE_BUILD=true 2>&1 | tee /tmp/build.log && break
            if [ $i -eq 5 ]; then echo "build failed after 5 attempts"; exit 1; fi
            echo "build failed (attempt $i/5), retrying in 45s"; sleep 45
          done

      - name: Install certificate and profiles
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE_APP: ${{ secrets.IOS_PROFILE_APP_BASE64 }}
          PROFILE_WIDGET: ${{ secrets.IOS_PROFILE_WIDGET_BASE64 }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KC" \
            | grep "Apple Distribution" | head -1 | awk '{print $2}')
          test -n "$IDENTITY" || { echo "no Apple Distribution identity"; exit 1; }
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KC=$KC" >> "$GITHUB_ENV"

          echo "$PROFILE_APP" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          echo "$PROFILE_WIDGET" | base64 --decode > "$RUNNER_TEMP/widget.mobileprovision"
          # Each target is signed with exactly the entitlements its App
          # Store profile grants (incl. the App Group) - nothing more.
          for p in app widget; do
            security cms -D -i "$RUNNER_TEMP/$p.mobileprovision" > "$RUNNER_TEMP/$p.plist"
            /usr/libexec/PlistBuddy -x -c "Print :Entitlements" \
              "$RUNNER_TEMP/$p.plist" > "$RUNNER_TEMP/$p.entitlements"
            echo "--- $p profile entitlements ---"
            cat "$RUNNER_TEMP/$p.entitlements"
          done

      - name: Sign app and widget
        run: |
          set -euo pipefail
          APP=build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app
          # Found by type, not name - the built bundle is
          # LocalSyncWidgetExtension.appex, not the target's own name.
          APPEX=$(find "$APP/PlugIns" -maxdepth 1 -name "*.appex" | head -1)
          test -n "$APPEX" && test -d "$APPEX" || { echo "widget extension missing"; ls -la "$APP/PlugIns" || true; exit 1; }
          echo "Widget: $APPEX"

          # The widget's version must match the app's (App Store rule).
          V=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          B=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $V" "$APPEX/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $B" "$APPEX/Info.plist"
          echo "Version $V ($B)"

          # Inside out: widget, embedded frameworks/dylibs, then the app.
          cp "$RUNNER_TEMP/widget.mobileprovision" "$APPEX/embedded.mobileprovision"
          codesign --force --sign "$IDENTITY" --keychain "$KC" \
            --entitlements "$RUNNER_TEMP/widget.entitlements" "$APPEX"

          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -maxdepth 1 \( -name "*.framework" -o -name "*.dylib" \) \
              -exec codesign --force --sign "$IDENTITY" --keychain "$KC" {} \;
          fi

          cp "$RUNNER_TEMP/app.mobileprovision" "$APP/embedded.mobileprovision"
          codesign --force --sign "$IDENTITY" --keychain "$KC" \
            --entitlements "$RUNNER_TEMP/app.entitlements" "$APP"

          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "--- signed app entitlements ---"
          codesign -d --entitlements - "$APP"

      - name: Package .ipa
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app \
            "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa" && zip -qry LocalSync.ipa Payload
          ls -l LocalSync.ipa

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          xcrun altool --upload-app -t ios -f "$RUNNER_TEMP/ipa/LocalSync.ipa" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Remove keychain and key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f ~/.appstoreconnect/private_keys/*.p8 "$RUNNER_TEMP"/*.p12 "$RUNNER_TEMP"/*.mobileprovision
