  <circle cx="0" cy="0" r="56" fill="#0a1120" stroke="url(#badgeGrad)" stroke-width="3"/>
  <g fill="none" stroke="url(#badgeGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
