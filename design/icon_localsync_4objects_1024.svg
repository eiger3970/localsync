<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
<defs>

<radialGradient id="bg" cx="36%" cy="26%" r="90%">
  <stop offset="0%" stop-color="#2c3c6b"/>
  <stop offset="40%" stop-color="#16203f"/>
  <stop offset="100%" stop-color="#03050c"/>
</radialGradient>

<radialGradient id="corridorGlow" cx="50%" cy="50%" r="50%">
  <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.18"/>
  <stop offset="60%" stop-color="#2447a8" stop-opacity="0.09"/>
  <stop offset="100%" stop-color="#2447a8" stop-opacity="0"/>
</radialGradient>

<radialGradient id="planetBody" cx="62%" cy="28%" r="75%">
  <stop offset="0%" stop-color="#3fae9c"/>
  <stop offset="35%" stop-color="#1c6b6a"/>
  <stop offset="70%" stop-color="#0d3547"/>
  <stop offset="100%" stop-color="#061224"/>
</radialGradient>

<radialGradient id="atmosphereGlow" cx="62%" cy="28%" r="75%">
  <stop offset="85%" stop-color="#5eead4" stop-opacity="0"/>
  <stop offset="97%" stop-color="#5eead4" stop-opacity="0.55"/>
  <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
</radialGradient>

<radialGradient id="milkyway" cx="50%" cy="50%" r="50%">
  <stop offset="0%" stop-color="#9db4ff" stop-opacity="0.16"/>
  <stop offset="55%" stop-color="#6d7fc9" stop-opacity="0.07"/>
  <stop offset="100%" stop-color="#6d7fc9" stop-opacity="0"/>
</radialGradient>

<linearGradient id="bodyLight" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#eef2f7"/>
  <stop offset="55%" stop-color="#c7cfdb"/>
  <stop offset="100%" stop-color="#9aa4b5"/>
</linearGradient>

<linearGradient id="bodyEdge" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#f7f9fc"/>
  <stop offset="100%" stop-color="#7d879a"/>
</linearGradient>

<linearGradient id="bodySide" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#606a7d"/>
  <stop offset="100%" stop-color="#2b3242"/>
</linearGradient>

<linearGradient id="keyDeck" x1="0%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%" stop-color="#e7ebf1"/>
  <stop offset="100%" stop-color="#8f99ab"/>
</linearGradient>

<linearGradient id="glassShine" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="30%" stop-color="#ffffff" stop-opacity="0"/>
  <stop offset="48%" stop-color="#ffffff" stop-opacity="0.12"/>
  <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>

<linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%" stop-color="#16233d"/>
  <stop offset="100%" stop-color="#0a1120"/>
</linearGradient>

<linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#5eead4"/>
  <stop offset="100%" stop-color="#22d3b8"/>
</linearGradient>

<radialGradient id="beamGlow" cx="50%" cy="50%" r="50%">
  <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.55"/>
  <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
</radialGradient>

<radialGradient id="topGloss" cx="50%" cy="8%" r="60%">
  <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
  <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
</radialGradient>

<filter id="softBlur" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="14"/>
</filter>

<filter id="wideBlur" x="-100%" y="-100%" width="300%" height="300%">
  <feGaussianBlur stdDeviation="28"/>
</filter>

<filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur in="SourceAlpha" stdDeviation="20" result="blur"/>
  <feOffset in="blur" dx="0" dy="18" result="offsetBlur"/>
  <feComponentTransfer in="offsetBlur" result="shadow">
    <feFuncA type="linear" slope="0.45"/>
  </feComponentTransfer>
  <feMerge>
    <feMergeNode in="shadow"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<clipPath id="laptopClip"><rect x="-172" y="-122" width="344" height="196" rx="10"/></clipPath>
<clipPath id="phoneClip"><rect x="-78" y="-154" width="156" height="288" rx="20"/></clipPath>
<clipPath id="deckClip"><rect x="-190" y="100" width="380" height="72"/></clipPath>

<g id="logoSL">
  <circle cx="0" cy="0" r="15" fill="#0a1120" stroke="url(#badgeGrad)" stroke-width="1.4"/>
  <g fill="none" stroke="url(#badgeGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="-6,-6 -1.5,0 -6,6" opacity="0.35"/>
    <polyline points="-2,-6 2.5,0 -2,6" opacity="0.65"/>
    <polyline points="2,-6 6.5,0 2,6" opacity="1.0"/>
  </g>
</g>

<radialGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#9ffbe9"/>
  <stop offset="55%" stop-color="#2dd4bf"/>
  <stop offset="100%" stop-color="#0e8f80"/>
</radialGradient>

<radialGradient id="badgeGlow" cx="50%" cy="50%" r="50%">
  <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.5"/>
  <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
</radialGradient>

<filter id="badgeBlur" x="-80%" y="-80%" width="260%" height="260%">
  <feGaussianBlur stdDeviation="10"/>
</filter>

</defs>

<rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>

<!-- LocalSync brand badge, top-left corner -->
<g transform="translate(150,150) scale(4.05)">
